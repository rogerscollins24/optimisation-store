services:
  - type: web
    name: optimization-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: optimization-db
          property: connectionString
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:4173,https://localhost:3000,https://localhost:4173
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
    autoDeploy: true
    
  - type: static
    name: optimization-frontend
    rootDir: optimization-front
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://optimization-backend.onrender.com
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: optimization-db
    plan: free
    databaseName: optimization_db
    user: optimization_user
